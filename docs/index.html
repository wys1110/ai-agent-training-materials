<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent Training Materials</title>
  <meta name="description" content="AI agent workflow training materials">
  <style>
    :root {
      --ink: #202226;
      --muted: #626a76;
      --paper: #f6f2ea;
      --surface: #fffdf8;
      --line: #ddd4c8;
      --green: #2f7656;
      --blue: #336f9e;
      --shadow: 0 18px 54px rgba(32, 34, 38, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(90deg, rgba(47, 118, 86, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(47, 118, 86, 0.07) 1px, transparent 1px),
        var(--paper);
      background-size: 44px 44px;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      word-break: keep-all;
    }

    main {
      width: min(1120px, calc(100vw - 40px));
      margin: 0 auto;
      padding: clamp(42px, 7vw, 92px) 0;
    }

    .kicker {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 14px;
      font-weight: 850;
      text-transform: uppercase;
    }

    h1 {
      max-width: 13ch;
      margin: 0;
      font-size: clamp(44px, 8vw, 92px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      max-width: 780px;
      margin: 24px 0 38px;
      color: var(--muted);
      font-size: clamp(19px, 2.2vw, 28px);
      line-height: 1.45;
    }

    .materials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      min-height: 260px;
      display: grid;
      align-content: space-between;
      gap: 28px;
      padding: clamp(22px, 3vw, 34px);
      color: inherit;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .card:hover {
      border-color: var(--green);
      transform: translateY(-2px);
    }

    .tag {
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      font-size: 14px;
      font-weight: 850;
    }

    .card h2 {
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .card p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    .arrow {
      color: var(--blue);
      font-size: 18px;
      font-weight: 850;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Training Materials</p>
    <h1>AI Agent 교육자료</h1>
    <p class="lead">Claude Code, Codex Skills, MCP, 그리고 실무에 바로 쓸 수 있는 에이전트 워크플로우 자료를 모으는 공간.</p>

    <section class="materials" aria-label="교육자료 목록">
      <a class="card" href="./caveman/">
        <span class="tag">Skill Explainer</span>
        <div>
          <h2>Caveman SKILL.md</h2>
          <p>실제 스킬 markdown을 기준으로 frontmatter, rules, examples, exception 구조를 해설.</p>
        </div>
        <span class="arrow">자료 열기 →</span>
      </a>
    </section>
  </main>
</body>
</html>
